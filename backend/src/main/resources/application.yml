spring:
  application:
    name: avicola
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avicola}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
