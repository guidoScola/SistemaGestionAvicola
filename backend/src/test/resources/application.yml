spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/avicola_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    clean-disabled: false
